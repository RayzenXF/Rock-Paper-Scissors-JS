<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <style>
        .console-game {
            width: 500px;
            height: 250px;
            background-color: black;
            color: greenyellow;
        }

        #rock-btn:disabled, #paper-btn:disabled, #scissors-btn:disabled, #reset-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

    </style>
</head>
<body>
    
    <div class="main-container">
        <h1>Rock, Paper, Scissors!</h1>
        <h2>Select:</h2>
        <div class="rps-button-container">
            <button class="rps-btn" id="rock-btn">✊</button>
            <button class="rps-btn" id="paper-btn">✋</button>
            <button class="rps-btn" id="scissors-btn">✌️</button>
        </div>
        <div class="reset-btn-container">
            <button class="rps-btn" id="reset-btn">Play again!</button>
        </div>

        <h2 id="score">Score: You: <span id="human-score">0</span> | Computer: <span id="computer-score">0</span></h2>

        <div class="console-game">
            <p id="console-para"></p>
        </div>
    </div>
        

    <script src="main.js"></script>
</body>
</html>
