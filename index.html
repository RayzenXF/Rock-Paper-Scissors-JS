<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="main-container">
        <h1 id="main-heading">Rock Paper Scissors!</h1>
        <h2>Select:</h2>
        <div class="rps-button-container">
            <button class="rps-btn" id="rock-btn">🪨</button>
            <button class="rps-btn" id="paper-btn">📃</button>
            <button class="rps-btn" id="scissors-btn">✂️</button>
        </div>
        <div class="reset-btn-container">
            <button class="rps-btn" id="reset-btn">Play again!</button>
            <h3 id="rules-heading"><i>First who score 5 - wins the game!</i></h3>
        </div>

        <h2 id="score">Score: <span class="human-score-txt">You:</span> <span class="human-score-txt" id="human-score">0</span> | <span class="computer-score-txt">Computer:</span> <span class="computer-score-txt" id="computer-score">0</span></h2>

        <div class="console-game">
            <p id="console-para">:></p>
        </div>
    </div>
        
    <script src="main.js"></script>
</body>
</html>
